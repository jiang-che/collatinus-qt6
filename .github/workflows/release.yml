name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  source:
    name: Source tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build source tarball
        run: |
          mkdir -p dist
          scripts/build-source-tarball.sh "${GITHUB_REF_NAME}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*.tar.xz
          if-no-files-found: error

  debian:
    name: Debian .deb
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkgconf \
            qt6-base-dev qt6-svg-dev qt6-tools-dev qt6-l10n-tools \
            libquazip1-qt6-dev debhelper
      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b
      - name: Collect .deb
        run: |
          mkdir -p dist
          cp ../collatinus-qt6_*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          if-no-files-found: error

  fedora:
    name: Fedora RPM
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          dnf install -y git rpm-build dnf-plugins-core redhat-rpm-config \
            cmake-rpm-macros gcc-plugin-annobin desktop-file-utils appstream
          dnf builddep -y packaging/rpm/collatinus-qt6.spec
      - name: Build RPMs
        env:
          RPMBUILD_TOPDIR: /tmp/rpmbuild
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build-rpm.sh
      - name: Collect RPMs
        run: |
          mkdir -p dist
          find /tmp/rpmbuild/RPMS /tmp/rpmbuild/SRPMS -name '*.rpm' -exec cp -t dist {} +
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*.rpm
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [ source, debian, fedora ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi
